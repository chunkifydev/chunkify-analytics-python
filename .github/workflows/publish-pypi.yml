# This workflow is triggered when a GitHub release is created.
# It can also be run manually to re-publish to PyPI in case it failed for some reason.
# You can run this workflow by navigating to https://www.github.com/chunkifydev/chunkify-analytics-python/actions/workflows/publish-pypi.yml
name: Publish PyPI
on:
  workflow_dispatch:

  release:
    types: [published]

jobs:
  publish:
    if: github.repository == 'chunkifydev/chunkify-analytics-python' && !github.event.repository.private
    name: publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rye
        run: |
          set -o pipefail
          # Retry the whole installer, including its internal Python download.
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 https://rye.astral.sh/get | bash; then
              echo "$HOME/.rye/shims" >> "$GITHUB_PATH"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Rye installation failed on attempt $attempt; retrying in 5 seconds." >&2
              sleep 5
            fi
          done
          echo "::error::Rye installation failed after 3 attempts."
          exit 1
        env:
          RYE_VERSION: '0.44.0'
          RYE_INSTALL_OPTION: '--yes'

      - name: Publish to PyPI
        run: |
          bash ./bin/publish-pypi
        env:
          PYPI_TOKEN: ${{ secrets.CHUNKIFY_ANALYTICS_PYPI_TOKEN || secrets.PYPI_TOKEN }}
